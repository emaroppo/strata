name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per plugin directory. Each is a distribution of its own; the
# strata packages it builds on come from wheels built beside it until they
# are on an index (.github/sibling-wheels.sh, run from this root).

jobs:
  plugin:
    name: ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: catalog/prepare-video
            siblings: labels common catalog
            standalone: strata-prepare-video[test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: .github/sibling-wheels.sh ${{ matrix.siblings }}
      - run: uv sync --no-cache --find-links ../../dist --group dev --extra test
        working-directory: ${{ matrix.plugin }}
      - run: uv run --no-sync ruff check .
        working-directory: ${{ matrix.plugin }}
      - run: uv run --no-sync ruff format --check .
        working-directory: ${{ matrix.plugin }}
      - run: uv run --no-sync pyright
        working-directory: ${{ matrix.plugin }}
      - run: uv run --no-sync pytest -q
        working-directory: ${{ matrix.plugin }}
      - run: uv build --wheel --out-dir dist ${{ matrix.plugin }}
      - run: uv venv --python 3.13 standalone
      - name: install the plugin alone
        run: |
          set -f
          uv pip install --no-cache --python standalone/bin/python --find-links dist ${{ matrix.standalone }} pytest
      - run: standalone/bin/python -m pytest -q ${{ matrix.plugin }}/tests
