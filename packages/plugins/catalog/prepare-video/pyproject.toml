[project]
name = "strata-prepare-video"
version = "0.1.0"
description = "Video into frames a catalog can hold, grouped so one video cannot straddle a split"
readme = "README.md"
requires-python = ">=3.13"
# The decoder is the whole reason this is its own distribution: a checkout
# with no video to convert should not carry one.
dependencies = [
    "strata-catalog>=0.1,<0.2",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "strata-catalog[test]>=0.1,<0.2"]

[project.entry-points."strata.preparers"]
video-frames = "strata.prepare_video.frames:VideoFramesPreparer"


# What developing this package alone needs beyond its extras. Inside the
# strata workspace the root's group is used instead.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The same set as every strata package: pinned, widened once, on purpose.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.isort]
# The namespace is one project however many repositories hold it, so a
# sibling package sorts with this one and not with the third parties.
known-first-party = ["strata"]

[tool.pyright]
include = ["strata"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
