[project]
name = "strata-labels"
version = "0.1.0"
description = "What an annotation is, and what a trainer is handed: value types, schemas, the indexing contract, the manifest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace: no strata/__init__.py in any package, or they stop merging
packages = ["strata"]
