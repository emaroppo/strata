services:
  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080:8080"
    volumes:
      - ls-data:/label-studio/data
      # The catalog's blobs, shared by every project. Must match
      # [catalog] root and blobs_prefix in config.toml.
      # Long syntax so a relative path stays a bind mount: in the short form,
      # a source without a leading ./ is read as a named volume.
      - type: bind
        source: ${STRATA_CATALOG:-./catalog}/blobs
        target: /label-studio/data/blobs
      # Tasks created before the cutover point at a per-project data root
      # rather than at the catalog. Nothing in the current loop needs it, and
      # a mount whose source may not exist stops the whole stack coming up —
      # so it is off by default. Uncomment and set AUTO_LABELLER_PROJECT in
      # .env to make an older Label Studio project show its images again.
      # - type: bind
      #   source: ${AUTO_LABELLER_PROJECT:-.}/data
      #   target: /label-studio/data/images
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data

  # The catalog index. Postgres rather than SQLite because the corpus runs
  # to millions of rows read from three machines at once, which is the point
  # SQLite stops being the right answer.
  catalog-db:
    image: postgres:17-alpine
    ports:
      - "${STRATA_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${STRATA_DB_USER:-strata}
      - POSTGRES_PASSWORD=${STRATA_DB_PASSWORD:-strata}
      - POSTGRES_DB=${STRATA_DB_NAME:-strata}
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      # So a machine that starts the stack and immediately ingests waits for
      # the database rather than failing on a connection refused
      test: ["CMD-SHELL", "pg_isready -U ${STRATA_DB_USER:-strata}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 for development and tests. Production is Garage on the home server;
  # both speak the same API, and what matters here is having a real server
  # to catch what a stub cannot — path-style addressing above all.
  blobs:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "${STRATA_S3_PORT:-9000}:9000"
      - "${STRATA_S3_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${STRATA_S3_ACCESS_KEY:-strata}
      - MINIO_ROOT_PASSWORD=${STRATA_S3_SECRET_KEY:-strataminio}
    volumes:
      - blobs:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ls-data:
  catalog-db:
  blobs:
