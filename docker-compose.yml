services:
  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080:8080"
    volumes:
      - ls-data:/label-studio/data
      # The active project's data directory. Set AUTO_LABELLER_PROJECT to the
      # project root (e.g. projects/my-project); it must match
      # [label_studio] local_files_root in project.toml (default: <project>/data).
      # Long syntax so a relative path stays a bind mount: in the short form,
      # a source without a leading ./ is read as a named volume.
      - type: bind
        source: ${AUTO_LABELLER_PROJECT:-.}/data
        target: /label-studio/data/images
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data

volumes:
  ls-data:
