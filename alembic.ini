# Two stores, two histories.
#
#   uv run alembic --name catalog   upgrade head
#   uv run alembic --name modelling upgrade head
#
# There is no [alembic] section on purpose: a bare `alembic upgrade head`
# would have to guess which database it meant, and the two are not
# interchangeable — one holds a corpus shared by every project on a host,
# the other holds one project's runs.
#
# Neither URL lives here. The catalog's comes from config.toml, which is the
# one place that says where a host's data is; the run store's is a path
# passed in. Both are overridable by environment variable, which is how a
# test points a migration run at a scratch database.

[catalog]
script_location = packages/catalog/strata/catalog/migrations
# $STRATA_CATALOG_URL, else [catalog] url in config.toml, else SQLite under
# the catalog root.
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[modelling]
script_location = packages/modelling/strata/modelling/migrations
# $STRATA_RUNS_URL. A run store is per project, so there is no host-wide
# setting to fall back to and the variable is required.
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
