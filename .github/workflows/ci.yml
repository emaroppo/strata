name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --no-default-groups --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  # Each package's own repository has the jobs that prove it stands alone;
# this workspace's jobs prove the packages agree with each other. The base
# install has no ML framework: this run also proves it stays that way.
  tests:
    name: tests (base install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --no-default-groups --group dev
      - run: uv run --no-sync pytest -q

  # The claim "one schema, two dialects" is either tested on both or
  # untested. The local suite covers SQLite; this covers the other half.
  postgres:
    name: tests (postgres index)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra postgres --group dev
      - run: uv run --no-sync pytest packages/catalog/tests/test_postgres.py -q
        env:
          STRATA_TEST_DB: postgresql+psycopg://strata:strata@localhost:5432/strata

  # Split out because the extras pull several GB of wheels.
  tests-extras:
    name: tests (--extra all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra all --group dev
      - run: uv run --no-sync python -c "import strata.modelling.baselines.image"
      - run: uv run --no-sync python -c "import strata.modelling.baselines.text"
      - run: uv run --no-sync pytest -q
      # Typed here, with every extra installed, so an optional framework is
      # a real import rather than a missing one.
      - run: uv run --no-sync pyright

