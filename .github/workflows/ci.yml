name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --no-default-groups --group dev
      - run: uv run --no-sync ruff check .

  # The base install has no ML framework: this run also proves it stays that way.
  tests:
    name: tests (base install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --no-default-groups --group dev
      - run: uv run --no-sync pytest -q

  # The claim "one schema, two dialects" is either tested on both or
  # untested. The local suite covers SQLite; this covers the other half.
  postgres:
    name: tests (postgres index)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra postgres --group dev
      - run: uv run --no-sync pytest packages/catalog/tests/test_postgres.py -q
        env:
          STRATA_TEST_DB: postgresql+psycopg://strata:strata@localhost:5432/strata

  # Split out because the extras pull several GB of wheels.
  tests-extras:
    name: tests (--extra all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra all --group dev
      - run: uv run --no-sync python -c "import strata.labeller.models.classifier"
      - run: uv run --no-sync python -c "import strata.labeller.models.text_classifier"
      - run: uv run --no-sync pytest -q

  # What keeps the dependency graph honest. Each package is installed alone,
  # so importing something it does not declare fails here rather than passing
  # review — in a dev checkout everything is present and nothing would catch it.
  isolation:
    name: isolation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: strata-labels
            module: strata.labels
            forbidden: strata.catalog, strata.modelling, strata.labeller
          - package: strata-catalog
            module: strata.catalog
            forbidden: strata.modelling, strata.labeller
          - package: strata-modelling
            module: strata.modelling
            forbidden: strata.catalog, strata.labeller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --package ${{ matrix.package }} --no-default-groups
      - name: import it
        run: uv run --no-sync python -c "import ${{ matrix.module }}"
      - name: and nothing it should not reach
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          forbidden = "${{ matrix.forbidden }}".replace(" ", "").split(",")
          reachable = []
          for name in forbidden:
              try:
                  importlib.import_module(name)
              except ImportError:
                  continue
              reachable.append(name)
          if reachable:
              raise SystemExit(
                  f"${{ matrix.package }} can reach {', '.join(reachable)}, "
                  f"which it does not declare"
              )
          PY
