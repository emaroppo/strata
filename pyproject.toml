[project]
name = "auto-labeller"
version = "0.1.0"
description = "Semi-automatic labelling pipeline with Label Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "label-studio-sdk>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

# The baseline models are the only thing here that needs an ML framework, and
# a project pointing [model] ref at its own model.py needs none of them. They
# are installed per media type so that a text project does not pull in a
# vision stack, or the other way round.
[project.optional-dependencies]
image = [
    "Pillow>=10.0",
    "timm>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
]
text = [
    "torch>=2.0",
    "transformers>=4.40",
]
all = [
    "auto-labeller[image,text]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
auto-labeller = "auto_labeller.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
