[tool.uv.workspace]
members = ["packages/*"]
# Sister repositories of their own, beside the others but not in this lock;
# each locks and tests itself and takes strata-common as a path source.
exclude = ["packages/feature-store", "packages/post-process"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.ruff]
line-length = 100
# Both inferred from [project] before the workspace split; the root has no
# [project] table now, so they are stated. Without target-version ruff reads
# tomllib as third-party and reorders every import block that uses it.
target-version = "py313"
src = [
    "packages/labels",
    "packages/common",
    "packages/catalog",
    "packages/modelling",
    "packages/labeller",
    "packages/experiment",
    # Preparer plugins. Listed for the same reason as the rest: without
    # it ruff reads their own namespace as third-party and reorders every
    # import block that mixes them with the packages they build on.
    "packages/prepare-email",
    "packages/prepare-video",
]

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases. Widened on purpose
# once, in one commit, rather than left to drift.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call defaults; that is its idiom, not a bug
"packages/*/strata/*/cli/*.py" = ["B008"]
"packages/*/strata/*/cli/**/*.py" = ["B008"]

[tool.pyright]
# Standard strictness over every package's source. Run with every extra
# installed, as CI's extras job does, so an optional framework is a real
# import rather than a missing one.
include = [
    "packages/labels/strata",
    "packages/common/strata",
    "packages/catalog/strata",
    "packages/modelling/strata",
    "packages/project/strata",
    "packages/labeller/strata",
    "packages/experiment/strata",
    "packages/prepare-email/strata",
    "packages/prepare-video/strata",
]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
