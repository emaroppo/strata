[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.ruff]
line-length = 100
# Both inferred from [project] before the workspace split; the root has no
# [project] table now, so they are stated. Without target-version ruff reads
# tomllib as third-party and reorders every import block that uses it.
target-version = "py313"
src = ["packages/labels", "packages/catalog", "packages/modelling", "packages/labeller"]

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases
select = ["E", "F", "I"]
