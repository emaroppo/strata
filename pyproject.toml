[tool.uv.workspace]
members = ["packages/*"]
# Sister repositories of their own, beside the others but not in this lock;
# each locks and tests itself and takes strata-common as a path source.
exclude = ["packages/feature-store", "packages/post-process"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.ruff]
line-length = 100
# Both inferred from [project] before the workspace split; the root has no
# [project] table now, so they are stated. Without target-version ruff reads
# tomllib as third-party and reorders every import block that uses it.
target-version = "py313"
src = [
    "packages/labels",
    "packages/common",
    "packages/catalog",
    "packages/modelling",
    "packages/labeller",
    "packages/experiment",
    # Preparer plugins. Listed for the same reason as the rest: without
    # it ruff reads their own namespace as third-party and reorders every
    # import block that mixes them with the packages they build on.
    "packages/prepare-email",
    "packages/prepare-video",
]

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases
select = ["E", "F", "I"]
