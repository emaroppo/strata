[tool.uv.workspace]
# Every package is a repository of its own, held here as a submodule so one
# checkout carries the whole system. Plugins sit under packages/plugins by
# the package they extend.
# Plugins are listed by the package they extend; a new grouping under
# packages/plugins is a new line here.
members = ["packages/*", "packages/plugins/catalog/*"]
# The plugins directory itself is a grouping, not a package.
exclude = ["packages/plugins"]

# Inside this workspace every strata package resolves to its sibling. A
# member declares no source of its own: a member's sources would override
# these, and a package alone resolves from an index or from wheels built
# beside it (see its ci.yml).
[tool.uv.sources]
strata-labels = { workspace = true }
strata-common = { workspace = true }
strata-catalog = { workspace = true }
strata-modelling = { workspace = true }
strata-project = { workspace = true }
strata-labeller = { workspace = true }
strata-experiment = { workspace = true }
strata-prepare-video = { workspace = true }
strata-feature-store = { workspace = true }
strata-post-process = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
# The packages this workspace tests as one suite. The two sister packages
# share test basenames with each other, so they run from their own
# directories (uv run pytest packages/feature-store), as their CI does.
testpaths = [
    "packages/labels",
    "packages/common",
    "packages/catalog",
    "packages/modelling",
    "packages/project",
    "packages/labeller",
    "packages/experiment",
    "packages/plugins",
]

[tool.ruff]
line-length = 100
# Both inferred from [project] before the workspace split; the root has no
# [project] table now, so they are stated. Without target-version ruff reads
# tomllib as third-party and reorders every import block that uses it.
target-version = "py313"
src = [
    "packages/labels",
    "packages/common",
    "packages/catalog",
    "packages/modelling",
    "packages/project",
    "packages/labeller",
    "packages/experiment",
    # Plugins. Listed for the same reason as the rest: without it ruff
    # reads their own namespace as third-party and reorders every import
    # block that mixes them with the packages they build on.
    "packages/plugins/catalog/prepare-video",
]

[tool.ruff.lint]
# Pinned: ruff's default set widens between releases. Widened on purpose
# once, in one commit, rather than left to drift.
select = ["E", "F", "I", "B", "SIM", "DTZ", "UP", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call defaults; that is its idiom, not a bug
"packages/*/strata/*/cli/*.py" = ["B008"]
"packages/*/strata/*/cli/**/*.py" = ["B008"]

[tool.pyright]
# Standard strictness over every package's source. Run with every extra
# installed, as CI's extras job does, so an optional framework is a real
# import rather than a missing one.
include = [
    "packages/labels/strata",
    "packages/common/strata",
    "packages/catalog/strata",
    "packages/modelling/strata",
    "packages/project/strata",
    "packages/labeller/strata",
    "packages/experiment/strata",
    "packages/plugins/catalog/prepare-video/strata",
]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
