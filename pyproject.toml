[project]
name = "auto-labeller"
version = "0.1.0"
description = "Semi-automatic image classification pipeline with Label Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "label-studio-sdk>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "Pillow>=10.0",
    "timm>=1.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
]

[project.scripts]
auto-labeller = "auto_labeller.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
