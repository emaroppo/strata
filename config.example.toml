# Host settings: how this machine reaches Label Studio.
# Copy to config.toml (gitignored) and fill in your token, or set
# LABEL_STUDIO_API_KEY in the environment instead.
#
# Everything about a labelling job lives in that project's project.toml.

[label_studio]
url = "http://localhost:8080"
api_key = ""
# Where the images mount appears inside the Label Studio container
local_storage_path = "/label-studio/data/images"

# Where the catalog lives on this machine. Which label set inside it a
# project annotates against is that project's business, in its project.toml.
[catalog]
root = "catalog"
# The index. Leave empty for SQLite under root, which needs nothing
# installed. Point it at Postgres to share one index across machines:
#   url = "postgresql+psycopg://strata:strata@localhost:5432/strata"
# $STRATA_CATALOG_URL overrides this, so credentials need not live in a file.
url = ""

# Where the blobs are. Empty means files under root, which needs nothing
# installed. An endpoint means tar shards in an S3-compatible bucket:
#   s3_endpoint = "http://localhost:9000"
# Credentials come from $STRATA_S3_ACCESS_KEY and $STRATA_S3_SECRET_KEY.
s3_endpoint = ""
s3_bucket = "strata"
# What the blobs mount is called inside the Label Studio container; must
# match the bind mount in docker-compose.yml.
blobs_prefix = "blobs"
