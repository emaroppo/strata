# Where things are, for this machine. Copy to config.toml (gitignored).
#
# This file names locations, not secrets. Every credential comes from the
# environment instead — a host, a user and a database say what data this
# project reads, and a password says nothing about it. How the environment
# gets filled is yours to choose: a password manager, a systemd
# EnvironmentFile, a sourced script.
#
# Everything about a labelling job lives in that project's project.toml.

[label_studio]
url = "http://localhost:8080"
# $LABEL_STUDIO_API_KEY. Also accepted here as api_key = "..." if you would
# rather, though then it is a secret in a file that gets copied around.
# Where the images mount appears inside the Label Studio container. Only
# used while Label Studio reads files off a mount; see serve_url below.
local_storage_path = "/label-studio/data/images"
# What the catalog's blobs mount is called inside the Label Studio
# container; must match the bind mount in docker-compose.yml. Only used
# until [catalog] serve_url is set, after which Label Studio fetches
# samples over HTTP instead.
blobs_prefix = "blobs"

# Where the catalog lives. Which label set inside it a project annotates
# against is that project's business, in its project.toml.
[catalog]
root = "catalog"

# The index. Leave empty for SQLite under root, which needs nothing
# installed. Point it at Postgres to share one index across machines:
#   url = "postgresql+psycopg://strata@catalog-host:5432/strata"
# Written without a password: $PGPASSWORD supplies that, so the file still
# says which data is in use. Nothing in the environment overrides where the
# catalog is, so pointing this machine at another one is an edit here.
url = ""

# Where the blobs are. Empty means files under root, which needs nothing
# installed. An endpoint means tar shards in an S3-compatible bucket:
#   s3_endpoint = "http://catalog-host:3900"
# Credentials come from $STRATA_S3_ACCESS_KEY and $STRATA_S3_SECRET_KEY.
s3_endpoint = ""
s3_bucket = "strata"

# The sample-serving API, if one is running:
#   serve_url = "http://catalog-host:8081"
# URLs it hands to Label Studio are signed with $STRATA_BLOB_SECRET, which
# must match what that server was started with.
serve_url = ""

# More than one catalog described here, if you need it. Keys above are
# shared — the endpoint, the bucket — and each named table layers on top of
# them, so shared storage is stated once. The default is the one used when
# nothing names another, so switching this machine is changing it:
#
#   [catalog]
#   s3_endpoint = "http://catalog-host:3900"
#   default = "images"
#
#   [catalog.images]
#   root = "catalog"
#
#   [catalog.text]
#   root = "text-catalog"
#   s3_bucket = "text"
#
# A project says which it draws from in its own [catalog] name; commands
# with no project take --catalog. 'auto-labeller catalogs' lists them.
# With several and no default, asking for "the default" is refused rather
# than guessed: a sample id means nothing outside the catalog that issued
# it, so opening the wrong one is silent.

# Where training happens. Empty means in this process, which is what a
# single machine wants. A URL sends rounds to the host with the GPU — it
# materialises the dataset itself, so only a dataset id travels.
#   url = "http://gpu-host:8082"
# Authorised with $STRATA_MODELLING_TOKEN, matching that host's own.
[modelling]
url = ""
